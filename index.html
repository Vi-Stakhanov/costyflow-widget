<!DOCTYPE html>

<html lang="ru">

<head>
	<meta charset="utf-8" />
	<title>Главная</title>
	<meta name="description" content="" />
	<meta http-equiv="X-UA-Compatible" content="IE=edge" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
</head>
<body>
    <!-- === НАЧАЛО КОДА ВИДЖЕТА — ВСТАВИТЬ ПЕРЕД </body> НА САЙТЕ === -->
    <style>
        .cf-widget{
            position: fixed;
            right: 24px;
            bottom: 24px;
            z-index: 999999;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 60px;
            height: 60px;
            border-radius: 14px;
            background: #0039d1;
            color: #fff;
            text-decoration: none;
            box-shadow: 0 10px 30px -4px rgba(0, 57, 209, 0.45);
            transition: transform .2s, box-shadow .2s, background .2s;
            }
            .cf-widget:hover{
            background: #002ea8;
            transform: translateY(-2px);
            box-shadow: 0 16px 36px -4px rgba(0, 57, 209, 0.55);
            }
            .cf-widget::after{
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 14px;
            box-shadow: 0 0 0 0 rgba(0, 57, 209, 0.5);
            animation: cf-pulse 2.4s infinite;
            pointer-events: none;
            }
            @keyframes cf-pulse{
            70%  { box-shadow: 0 0 0 14px rgba(0, 57, 209, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 57, 209, 0); }
            }
            .cf-widget__icon{ width: 26px; height: 26px; flex: none; }
            @media (max-width: 600px){
            .cf-widget{ right: 16px; bottom: 16px; width: 54px; height: 54px; }
            .cf-widget__icon{ width: 22px; height: 22px; }
            }
    </style>
    
    <a class="cf-widget" href="https://client-id.costyflow.ru" target="_blank" rel="noopener" aria-label="Рассчитать стоимость">
    <svg class="cf-widget__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="4" y="2" width="16" height="20" rx="2"></rect>
        <line x1="8" y1="6" x2="16" y2="6"></line>
        <path d="M8 10h.01M12 10h.01M16 10h.01M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01M16 18h.01"></path>
    </svg>
    </a>
    <!-- === КОНЕЦ КОДА ВИДЖЕТА === -->
    
</body>
</html>
